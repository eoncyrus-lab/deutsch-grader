routes:
  vision-default:
    provider: openai_compat
    model: gpt-4.1-mini
    family: openai
    supports_vision: true
    base_url_env: DG_LLM_BASE_URL
    api_key_env: DG_LLM_API_KEY
    params: {temperature: 0, max_tokens: 2000}
  strong-a:
    provider: openai_compat
    model: gpt-4.1
    family: openai
    base_url_env: DG_LLM_BASE_URL
    api_key_env: DG_LLM_API_KEY
    params: {temperature: 0, max_tokens: 4000}
  strong-b:
    provider: openai_compat
    model: claude-sonnet-4
    family: anthropic
    base_url_env: DG_LLM_B_BASE_URL
    api_key_env: DG_LLM_B_API_KEY
    params: {temperature: 0, max_tokens: 2000}
  cheap:
    provider: openai_compat
    model: gpt-4.1-mini
    family: openai
    base_url_env: DG_LLM_BASE_URL
    api_key_env: DG_LLM_B_API_KEY
    params: {temperature: 0, max_tokens: 2000}
  fixture:
    provider: fixture
    model: fixture-v1
    family: fixture
    params: {}
