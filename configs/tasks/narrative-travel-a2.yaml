task_id: narrative-travel-a2
version: 2.0.0
name: 叙事作文：最好的一次旅行
language: de
level: A2
grade_band: 初一-高一
rubric_id: narrative-a2
rubric_version: 2.0.0
topic_default: Meine beste Reise
status: active

prompts:
  s1: s1@1.0.0
  s2: s2-de@1.3.0
  s2b: s2b-de@1.1.0
  s3: s3-checklist@1.1.0
  s5: s5-de@1.0.2

model_routes:
  s1: vision-default
  s2: strong-a
  s2b: strong-b
  s3: cheap
  s5: cheap

error_types:
  - {key: 变位, weight: 1.0, impact: 3, description: 动词人称或时态变位错误}
  - {key: 助动词, weight: 1.0, impact: 3, description: sein/haben/werden 选择错误}
  - {key: 格, weight: 1.0, impact: 3, description: 冠词、物主冠词或介词宾语的格错误}
  - {key: 词尾, weight: 1.0, impact: 2, description: 形容词或名词词尾错误}
  - {key: 语序, weight: 1.0, impact: 2, description: 主谓、框形或从句语序错误}
  - {key: 拼写, weight: 0.5, impact: 1, description: 拼写错误}
  - {key: 选词, weight: 1.0, impact: 2, description: 介词或词语选择错误}
  - {key: 标点, weight: 0.5, impact: 1, description: 标点错误}
  - {key: 时态, weight: 1.0, impact: 3, description: 时态使用错误}
  - {key: 动词结构缺失, weight: 1.0, impact: 4, description: 整句缺少可用谓语}

error_codes:
  - {code: V_CONJ, type: 变位, label: 动词变位, examples: ["du geht -> du gehst"]}
  - {code: AUX_MOVE, type: 助动词, label: 位移动词助动词, examples: ["haben gefahren -> sind gefahren"]}
  - {code: CASE_PREP, type: 格, label: 介词支配的格, examples: ["mit meine Mutter -> mit meiner Mutter"]}
  - {code: ADJ_END, type: 词尾, label: 形容词词尾, examples: ["ein schön Tag -> ein schöner Tag"]}
  - {code: WORD_ORDER, type: 语序, label: 语序, examples: ["weil ich habe -> weil ich habe"]}
  - {code: SPELL, type: 拼写, label: 拼写, examples: ["Spazierlitten -> Spaziergang"]}
  - {code: WORD_CHOICE, type: 选词, label: 词语或介词选择, examples: ["in Qingdao gefahren -> nach Qingdao gefahren"]}
  - {code: PUNCT, type: 标点, label: 标点, examples: ["fehlendes Komma"]}
  - {code: TENSE, type: 时态, label: 时态, examples: ["gestern fahre -> gestern gefahren"]}
  - {code: MISSING_VERB, type: 动词结构缺失, label: 缺少谓语, examples: ["Ich gestern nach Berlin."]}

dedup:
  repeat_weight: 0.25
  pattern_cap: 2.0
  verb_structure: {type: 动词结构缺失, per_sentence: 1.0, cap: 4.0}

language_rubric:
  max: 5
  table:
    - {max_points: 1, score: 5}
    - {max_points: 2.5, score: 4.5}
    - {max_points: 4, score: 4}
    - {max_points: 6, score: 3.5}
    - {max_points: 8, score: 3}
    - {max_points: 11, score: 2.5}
    - {max_points: 14, score: 2}
  default_score: 1.5
  comprehension: {floor_score: 2, floor_min_ratio: 0.5, ceiling_score: 1, ceiling_below_ratio: 0.3}

checklist:
  fields:
    - {key: on_topic, type: bool, question: 是否写“最好的一次旅行”}
    - {key: time, type: bool, question: 是否交代时间}
    - {key: place, type: bool, question: 是否交代地点}
    - {key: companions, type: bool, question: 是否交代同行者}
    - {key: activities, type: evidence_items, question: 列出每件具体活动及 sid}
    - {key: concrete_detail, type: bool, question: 至少一件活动有具体细节}
    - {key: feeling_or_reason, type: bool, question: 是否写感受或说明为什么是最好的旅行}
    - {key: sequence_markers, type: string_list, question: 列出顺序词}
    - {key: chronological, type: bool, question: 事件顺序是否清楚}
    - {key: ending_states_best, type: bool, question: 结尾是否点明“最好”}
    - {key: ending_has_reason, type: bool, question: 结尾是否给出理由}
    - {key: ending_repeats_opening, type: bool, question: 结尾是否只重复开头}
    - {key: contradiction, type: bool, question: 是否存在前后矛盾}

content:
  max: 3
  off_topic_field: on_topic
  required:
    - {field: time}
    - {field: place}
    - {field: companions}
    - {op: gte, args: [{field: activities_count}, {value: 2}]}
    - {field: feeling_or_reason}
  detail: {field: concrete_detail}
  bands:
    - when: {op: and, args: [{op: eq, args: [{field: missing_count}, {value: 0}]}, {field: detail_ok}]}
      score: 3
    - when: {op: eq, args: [{field: missing_count}, {value: 0}]}
      score: 2.5
    - when: {op: eq, args: [{field: missing_count}, {value: 1}]}
      score: 2
    - when: {op: eq, args: [{field: missing_count}, {value: 2}]}
      score: 1.5
    - score: 1

structure:
  max: 2
  zero_if: {field: contradiction}
  order_ok:
    op: or
    args:
      - {op: gte, args: [{field: sequence_markers_count}, {value: 2}]}
      - op: and
        args:
          - {op: gte, args: [{field: sequence_markers_count}, {value: 1}]}
          - {field: chronological}
  ending_ok:
    op: and
    args:
      - {field: ending_states_best}
      - {field: ending_has_reason}
      - {op: not, args: [{field: ending_repeats_opening}]}
  bands:
    - when: {field: zero}
      score: 0
    - when: {op: and, args: [{field: order_ok}, {field: ending_ok}]}
      score: 2
    - when: {op: or, args: [{field: order_ok}, {field: ending_ok}]}
      score: 1.5
    - score: 1

length:
  unit: words
  exclude_title: true
  caps:
    - {lt: 30, total_max: 4}
    - {lt: 40, total_max: 5}

title:
  required: true
  deduct: 0.5

rounding: {step: 0.5}
