[project]
name = "deutsch-grader"
version = "0.1.0"
description = "Config-driven German essay grading pipeline with teacher review"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "cryptography>=43",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[tool.setuptools.package-data]
app = ["web/*", "sql/*", "prompts/*.txt"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
]

[project.scripts]
grading-worker = "app.queue:main"
grading-eval = "eval.run:main"
grading-gate = "eval.gate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
